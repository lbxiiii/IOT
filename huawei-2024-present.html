<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华为生态链2024-至今空间智能生态成熟期深度分析</title>
    <link rel="stylesheet" href="css/style-huawei.css">
    <script src="data/huawei-2024-present-content.js"></script>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-title">生态链&IoT平台建设历程分析</a>
            <div class="company-tags">
                <button class="company-tag" onclick="window.location.href='xiaomi-2010-2013.html'">小米生态链及IoT</button>
                <button class="company-tag" onclick="window.location.href='tuya-2014-2016.html'">涂鸦智能IoT</button>
                <button class="company-tag active" onclick="window.location.href='huawei-2014-2018.html'">华为生态链</button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-content">
        <div class="period-detail-container">
            <!-- 时期板块 -->
            <section class="period-section">
                <div class="period-cards-6">
                    <a href="huawei-2014-2018.html" class="period-card" data-period="2014-2018">
                        <div class="period-header">
                            <span class="period-year">2014-2018</span>
                            <h3 class="period-title">连接协议奠基期</h3>
                        </div>
                    </a>

                    <a href="huawei-2019-2020.html" class="period-card" data-period="2019-2020">
                        <div class="period-header">
                            <span class="period-year">2019-2020</span>
                            <h3 class="period-title">IoT平台升级期</h3>
                        </div>
                    </a>

                    <a href="huawei-2021-2023.html" class="period-card" data-period="2021-2023">
                        <div class="period-header">
                            <span class="period-year">2021-2023</span>
                            <h3 class="period-title">鸿蒙智联飞跃期</h3>
                        </div>
                    </a>

                    <a href="huawei-2024-present.html" class="period-card active" data-period="2024-present">
                        <div class="period-header">
                            <span class="period-year">2024-至今</span>
                            <h3 class="period-title">空间智能生态成熟期</h3>
                        </div>
                    </a>

                    <a href="huawei-deep-analysis.html" class="period-card" data-period="deep-analysis">
                        <div class="period-header">
                            <span class="period-year">深度分析</span>
                            <h3 class="period-title">全景剖析</h3>
                        </div>
                    </a>

                    <a href="huawei-experience-reuse.html" class="period-card" data-period="experience-reuse">
                        <div class="period-header">
                            <span class="period-year">经验复用</span>
                            <h3 class="period-title">可复制经验</h3>
                        </div>
                    </a>
                </div>
            </section>

            <!-- 分析维度 -->
            <section class="analysis-section">
                <div class="analysis-container">
                    <!-- 维度标签 -->
                    <div class="dimension-tabs">
                        <button class="dimension-tab active" data-dimension="strategy">本阶段战略定位</button>
                        <button class="dimension-tab" data-dimension="technology">技术支撑与护城河</button>
                        <button class="dimension-tab" data-dimension="customer">生态客户与流量</button>
                        <button class="dimension-tab" data-dimension="empowerment">生态赋能与管理</button>
                        <button class="dimension-tab" data-dimension="business">商业与盈利模式</button>
                        <button class="dimension-tab" data-dimension="organization">组织与人才</button>
                        <button class="dimension-tab" data-dimension="investment">投资回报与成果</button>
                        <button class="dimension-tab" data-dimension="risk">风险与管控</button>
                        <button class="dimension-tab" data-dimension="trial">试错与复盘</button>
                        <button class="dimension-tab" data-dimension="milestone">里程碑事件</button>
                    </div>

                    <!-- 维度内容 -->
                    <div class="dimension-content-wrapper">
                        <div id="dimension-content" class="dimension-content">
                            <p>加载中...</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        // 等待外部JS加载
        document.addEventListener('DOMContentLoaded', function() {
            const dimensionTabs = document.querySelectorAll('.dimension-tab');
            const dimensionContent = document.getElementById('dimension-content');

            // 初始化显示第一个维度
            if (typeof huawei2024presentData !== 'undefined') {
                const firstDimension = 'strategy';
                dimensionContent.innerHTML = `<h2>${huawei2024presentData[firstDimension].title}</h2>${huawei2024presentData[firstDimension].content}`;
            }

            dimensionTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    // 移除所有active状态
                    dimensionTabs.forEach(t => t.classList.remove('active'));
                    // 添加当前tab的active状态
                    tab.classList.add('active');

                    // 获取对应维度数据
                    const dimension = tab.dataset.dimension;

                    if (huawei2024presentData[dimension]) {
                        dimensionContent.style.opacity = '0';
                        setTimeout(() => {
                            dimensionContent.innerHTML = `<h2>${huawei2024presentData[dimension].title}</h2>${huawei2024presentData[dimension].content}`;
                            dimensionContent.style.opacity = '1';
                        }, 150);
                    }
                });
            });
        });
    </script>
</body>
</html>
