<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小米生态链2019-2023年协同期深度分析</title>
    <link rel="stylesheet" href="css/style-xiaomi.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-title">生态链&IoT平台建设历程分析</a>
            <div class="company-tags">
                <button class="company-tag active" onclick="window.location.href='xiaomi.html'">小米生态链及IoT</button>
                <button class="company-tag" onclick="window.location.href='tuya.html'">涂鸦智能IoT</button>
                <button class="company-tag" onclick="window.location.href='index.html'">华为生态链</button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-content">
        <div class="company-page active">
            <!-- 时期板块 -->
            <section class="period-section">
                <div class="period-cards">
                    <a href="xiaomi-2010-2013.html" class="period-card" data-period="2010-2013">
                        <div class="period-header">
                            <span class="period-year">2010-2013</span>
                            <h3 class="period-title">雏形期</h3>
                        </div>
                    </a>

                    <a href="xiaomi-2014-2018.html" class="period-card" data-period="2014-2018">
                        <div class="period-header">
                            <span class="period-year">2014-2018</span>
                            <h3 class="period-title">扩张期</h3>
                        </div>
                    </a>

                    <a href="xiaomi-2019-2023.html" class="period-card active" data-period="2019-2023">
                        <div class="period-header">
                            <span class="period-year">2019-2023</span>
                            <h3 class="period-title">手机×AIoT发展期</h3>
                        </div>
                    </a>

                    <a href="xiaomi-2024-present.html" class="period-card" data-period="2024-present">
                        <div class="period-header">
                            <span class="period-year">2024-现在</span>
                            <h3 class="period-title">人车家全生态成型期</h3>
                        </div>
                    </a>

                    <a href="xiaomi-2013-2015-iot.html" class="period-card" data-period="2013-2015-iot">
                        <div class="period-header">
                            <span class="period-year">2013-2015</span>
                            <h3 class="period-title">IoT平台奠基期</h3>
                        </div>
                    </a>

                    <a href="xiaomi-2016-2018-iot.html" class="period-card" data-period="2016-2018-iot">
                        <div class="period-header">
                            <span class="period-year">2016-2018</span>
                            <h3 class="period-title">IoT平台起步期</h3>
                        </div>
                    </a>

                    <a href="xiaomi-2019-2023-ecosystem.html" class="period-card" data-period="2019-2023-ecosystem">
                        <div class="period-header">
                            <span class="period-year">2019-2023</span>
                            <h3 class="period-title">手机×AIoT生态链</h3>
                        </div>
                    </a>

                    <a href="xiaomi-2024-present-ecosystem.html" class="period-card" data-period="2024-present-ecosystem">
                        <div class="period-header">
                            <span class="period-year">2024-至今</span>
                            <h3 class="period-title">人车家全生态</h3>
                        </div>
                    </a>
                </div>
            </section>

            <!-- 分析维度 -->
            <section class="analysis-section">
                <div class="analysis-container">
                    <!-- 维度标签 -->
                    <div class="dimension-tabs">
                        <button class="dimension-tab active" data-dimension="strategy">战略与策略</button>
                        <button class="dimension-tab" data-dimension="technology">技术与壁垒</button>
                        <button class="dimension-tab" data-dimension="customer">客户与流量</button>
                        <button class="dimension-tab" data-dimension="empowerment">生态赋能与管理</button>
                        <button class="dimension-tab" data-dimension="profit">商业与盈利模式</button>
                        <button class="dimension-tab" data-dimension="organization">组织与人才</button>
                        <button class="dimension-tab" data-dimension="investment">投资回报与成果</button>
                        <button class="dimension-tab" data-dimension="risk">风险与管控</button>
                        <button class="dimension-tab" data-dimension="trial">试错与复盘</button>
                        <button class="dimension-tab" data-dimension="milestone">里程碑事件</button>
                    </div>

                    <!-- 维度内容 -->
                    <div class="dimension-content-wrapper">
